name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillbridge
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: skillbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillbridge -d skillbridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://skillbridge:skillbridge@localhost:5432/skillbridge
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
      ADMIN_SEED_PASSWORD: CI-admin-password-123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: docker compose config --quiet
      - run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - run: docker build -f server/Dockerfile --target runtime -t skillbridge-api:ci .
      - run: docker build -f server/Dockerfile --target migrate -t skillbridge-migrate:ci .
      - run: docker build -f client/Dockerfile -t skillbridge-web:ci .
